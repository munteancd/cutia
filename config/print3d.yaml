# Cardurile din 3D Print, pe grupuri. Card cu poză (web/img/print3d/) când
# vrem să arătăm rezultatul real; altfel o iconiță.
# Adaugă: - {group: ..., name: ..., url: ..., image: ....webp SAU icon: 🧩, description: ...}
- group: Site-uri
  name: SkipTheCAD
  url: "https://skipthecad.com/"
  image: skipthecad.webp
  description: "Director cu sute de generatoare: formular, poză sau text → STL/3MF, fără CAD."
- group: Site-uri
  name: ilove3d
  url: "https://ilove3d.app/en"
  image: ilove3d.webp
  description: "Unelte 3D în browser pentru modele de printat."

